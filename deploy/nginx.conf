# portal.parkchest.ir — Arvan CDN terminates client TLS and re-encrypts to this origin on :8880.
# Origin cert (self-signed is fine for the Arvan->origin leg):
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 3650 \
#     -subj "/CN=portal.parkchest.ir" -addext "subjectAltName=DNS:portal.parkchest.ir" \
#     -keyout /etc/nginx/ssl/portal.key -out /etc/nginx/ssl/portal.crt
# Install:
#   cp deploy/nginx.conf /etc/nginx/sites-available/portal.parkchest.ir
#   ln -s ../sites-available/portal.parkchest.ir /etc/nginx/sites-enabled/
#   deploy/arvan-ips.sh            # generates /etc/nginx/arvan-ips.conf
#   nginx -t && systemctl reload nginx

server {
    listen 8880 ssl http2;             # :80/:443 owned by xray on this host; Arvan origin = HTTPS :8880
    ssl_certificate     /etc/nginx/ssl/portal.crt;
    ssl_certificate_key /etc/nginx/ssl/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name portal.parkchest.ir;

    # only Arvan edges may reach the origin; real client IP from Arvan header
    include /etc/nginx/arvan-ips.conf;
    deny all;
    real_ip_header ar-real-ip;

    client_max_body_size 12m;          # two 5 MB images
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # = real client after real_ip
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
