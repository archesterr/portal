services:
  portal:
    build: .
    image: portal:latest
    restart: unless-stopped
    env_file: .env
    # same host as the panel: reach it on 127.0.0.1; app itself binds loopback only (nginx in front)
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips=127.0.0.1", "--no-server-header", "--workers", "1"]
    volumes:
      - ./data:/data
