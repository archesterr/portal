<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>{{ brand }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a href="/" class="brand"><span class="dot"></span>{{ brand }}</a>
  <nav>
    {% if is_admin %}<a href="/admin">مدیریت</a>{% endif %}
    {% if user %}
      <form method="post" action="/logout"><button class="link">خروج</button></form>
    {% elif is_admin %}
      <form method="post" action="/admin/logout"><button class="link">خروج</button></form>
    {% endif %}
  </nav>
</header>
<main class="wrap">
  {% if flash %}<div class="flash {{ flash.k }}">{{ flash.m }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
{% if telegram %}
<footer class="foot">پشتیبانی در تلگرام: <a href="https://t.me/{{ telegram }}" dir="ltr">@{{ telegram }}</a></footer>
{% endif %}
<script src="/static/app.js"></script>
</body>
</html>
