{% extends "base.html" %}
{% block body %}
<section class="card narrow">
  <h1>کد تأیید</h1>
  <p class="muted">کد ۶ رقمی ارسال‌شده به <b dir="ltr">{{ phone }}</b> را وارد کنید.</p>
  <form method="post" action="/verify" class="stack">
    <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="otp" dir="ltr" required autofocus>
    <button class="btn" type="submit">ورود</button>
  </form>
  <form method="post" action="/login" class="center">
    <input type="hidden" name="phone" value="{{ phone }}">
    <button class="link" type="submit">ارسال دوباره کد</button> ·
    <a href="/login" class="link">تغییر شماره</a>
  </form>
</section>
{% endblock %}
